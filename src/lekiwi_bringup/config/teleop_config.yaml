# 遥操作参数配置

# joy_to_cmd_vel 参数
joy_to_cmd_vel:
  ros__parameters:
    linear_scale: 0.5          # m/s
    angular_scale: 1.0         # rad/s
    deadzone: 0.1

# joy_node 参数
joy_node:
  ros__parameters:
    deadzone: 0.05
    autorepeat_rate: 20.0

# 底盘驱动参数
lekiwi_base_node:
  ros__parameters:
    port: "/dev/ttyACM0"
    robot_id: "lekiwi"
    watchdog_timeout_ms: 500
    control_freq: 30.0
    use_cameras: false
